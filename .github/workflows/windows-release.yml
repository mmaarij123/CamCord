name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check source and tag version
        id: version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          $version = (Get-Content ui/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid source version' }
          if ($env:RELEASE_REF.StartsWith('refs/tags/') -and $env:RELEASE_REF -ne "refs/tags/v$version") { throw 'Tag and source versions differ' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Validate source
        shell: pwsh
        run: python tests/validate_project.py
      - name: Build and package CamCord
        shell: pwsh
        run: .\scripts\package-release.ps1
      - name: Test UI
        working-directory: ui
        shell: pwsh
        run: npm test
      - name: Test settings and output folders
        shell: pwsh
        run: .\tests\settings-test.ps1
      - name: Test recording finalization and recovery
        shell: pwsh
        run: .\tests\pipeline-test.ps1 -Ffmpeg .\bin\Release\ffmpeg.exe
      - name: Test updater and startup preferences
        shell: pwsh
        run: .\tests\app-features-test.ps1
      - name: Generate release checksums
        shell: pwsh
        run: |
          Get-Item dist/CamCord-Setup.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS.txt
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: CamCord-Windows-x64
          path: |
            dist/CamCord-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CamCord-Windows-x64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "CamCord $RELEASE_VERSION" --generate-notes
