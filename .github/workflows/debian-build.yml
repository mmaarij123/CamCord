name: Build and test Debian package

on:
  push:
    branches: ["codex/debian-port", "codex/instant-replay"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build in Debian 12 for Debian 12/13 compatibility
        run: docker build --progress=plain -f linux/Dockerfile -t camcord-debian .
      - name: Test isolated install, real X11 capture/audio, UI and uninstall
        timeout-minutes: 5
        run: docker run --rm --shm-size=512m camcord-debian
      - name: Collect verified Debian package
        run: |
          mkdir -p dist
          container=$(docker create camcord-debian)
          docker cp "$container:/workspace/linux/out/CamCord-Debian-amd64.deb" dist/
          docker rm "$container"
          cd dist
          sha256sum CamCord-Debian-amd64.deb > SHA256SUMS-Linux.txt
          dpkg-deb --info CamCord-Debian-amd64.deb
      - name: Verify runtime dependencies on clean Debian 12 and 13
        timeout-minutes: 10
        run: |
          for image in debian:bookworm-slim debian:trixie-slim; do
            docker run --rm -v "$PWD/dist:/packages:ro" "$image" sh -eu -c '
              apt-get update
              apt-get install -y --no-install-recommends /packages/CamCord-Debian-amd64.deb
              ldd /opt/camcord/camcord > /tmp/runtime-libraries
              cat /tmp/runtime-libraries
              if grep -q "not found" /tmp/runtime-libraries; then exit 1; fi
              test "$(stat -c %a /opt/camcord/chrome-sandbox)" = 4755
              dpkg -r camcord
              test ! -e /opt/camcord/camcord
            '
          done
      - uses: actions/upload-artifact@v4
        with:
          name: CamCord-Debian-amd64
          path: |
            dist/CamCord-Debian-amd64.deb
            dist/SHA256SUMS-Linux.txt
          if-no-files-found: error
